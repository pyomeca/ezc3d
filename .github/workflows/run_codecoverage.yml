name: Code coverage

on: [pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_FOLDER: build

jobs:
  build:
    name: linux-64
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Get number of CPU cores
        uses: SimenB/github-actions-cpu-cores@v3
        id: cpu-cores

      - name: Setup environment
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          activate-environment: ezc3d
          environment-file: environment.yml
        
      - name: Print conda info
        run: | 
          conda info
          conda list
          
      - name: Install code coverage dependencies
        run: | 
          conda install cmake git pkgconfig codecov lcov -cconda-forge
          conda list
          git submodule update --init --recursive

      - name: Perform code coverage 
        run: |
          MAIN_FOLDER=`pwd`
          CONDA_ENV_PATH=$CONDA/envs/ezc3d
          mkdir -p $BUILD_FOLDER
          cd $BUILD_FOLDER
          cmake -DCMAKE_INSTALL_PREFIX=$CONDA_ENV_PATH -DCMAKE_BUILD_TYPE=Coverage -DBUILD_TESTS=ON -DBUILD_EXAMPLE=OFF -DBUILD_DOC=OFF -DUSE_MATRIX_FAST_ACCESSOR=OFF -DBINDER_PYTHON3=OFF ..
          # The coverage target runs the tests and produces coverage.info (see modules/CodeCoverage.cmake)
          make ezc3d_coverage -j${{ steps.cpu-cores.outputs.count }}
          lcov --list coverage.info
          cd $BIORBD_FOLDER

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ${{ env.BUILD_FOLDER }}/coverage.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
